# Yalnız lo + tailscale0; Tailscale IPv4 bu dosyaya gömülmez (bind-dynamic).
interface=lo
interface=__TAILSCALE_IF__
bind-dynamic
no-dhcp-interface=lo
no-dhcp-interface=__TAILSCALE_IF__
domain-needed
bogus-priv
no-resolv
no-hosts
local=/__LOCAL_DOMAIN__/
local-ttl=60

interface-name=panel.__LOCAL_DOMAIN__,__TAILSCALE_IF__/4
