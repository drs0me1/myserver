# wg-quick@.service.d/master-stack.conf (DD-180). Bir WireGuard ağı güvenlik duvarı
# kurulmadan açılmaz: kurallar yokken FORWARD varsayılanı açık kalır ve istemciler
# sağlayıcının iç ağı dahil özel adreslere ulaşabilirdi (DD-177 engeli yalnız MASTER-FORWARD'da).
# Caddy ile aynı kalıp. Duvar sonradan düzelirse refresh-tailnet-config failed ağları açar.
[Unit]
Wants=master-firewall.service
After=master-firewall.service

[Service]
ExecStartPre=+__SBIN_DIR__/master-firewall --check
